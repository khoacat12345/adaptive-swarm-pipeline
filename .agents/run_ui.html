<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adaptive Swarm — Run Viewer</title>
  <style>
    :root {
      --bg: #08111a;
      --panel: #0d1925;
      --panel2: #101f2d;
      --line: #1d3042;
      --text: #d9e8f4;
      --dim: #8da3b6;
      --dim2: #5d7487;
      --ok: #62d394;
      --warn: #f0ba54;
      --bad: #ef6b6b;
      --ac: #52aee8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 Inter, Segoe UI, sans-serif; }
    header { display: flex; gap: 16px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #0b151f; }
    .brand { font-weight: 700; color: var(--ac); letter-spacing: .3px; }
    .runid { font: 12px Consolas, monospace; color: var(--dim); }
    .grow { flex: 1; }
    .status { padding: 3px 8px; border-radius: 6px; background: var(--panel2); font: 10px Consolas, monospace; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .status.warn { color: var(--warn); }
    main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
    .tabs button { border: 0; background: var(--panel); color: var(--dim); padding: 8px 13px; border-radius: 7px; cursor: pointer; }
    .tabs button.active { background: #17324a; color: var(--text); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; }
    h1, h2, h3 { margin: 0 0 8px; }
    h1 { font-size: 22px; }
    h2 { font-size: 14px; }
    h3 { font-size: 12px; }
    .muted { color: var(--dim); }
    .mono { font-family: Consolas, monospace; font-size: 11px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .chip { border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; color: var(--dim); font-size: 10px; }
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 12px; }
    .kv .k { color: var(--dim2); }
    .steps { display: flex; gap: 6px; flex-wrap: wrap; }
    .step { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; min-width: 110px; color: var(--dim); }
    .step.done { border-color: #1c5c45; color: var(--ok); }
    .step.active { border-color: #2c83b6; color: var(--ac); }
    .phase { border-top: 1px solid var(--line); padding: 10px 0; }
    .phase:first-child { border-top: 0; }
    .event { border-left: 2px solid var(--line); padding: 5px 10px; margin: 5px 0; }
    .event b { color: var(--ac); }
    .event .meta { color: var(--dim2); font: 10px Consolas, monospace; }
    .event .body { white-space: pre-wrap; color: var(--dim); font-size: 12px; margin-top: 2px; }
    .msg { background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
    .msg .sender { color: var(--ac); font-weight: 600; font-size: 11px; }
    .msg .time { color: var(--dim2); font: 10px Consolas, monospace; margin-left: 8px; }
    .msg .text { white-space: pre-wrap; margin-top: 3px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button.primary, button.ghost { border-radius: 7px; padding: 7px 10px; cursor: pointer; font-size: 11px; }
    button.primary { border: 0; background: #1e7eb7; color: white; }
    button.ghost { border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
    input, select { background: #08121c; border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 7px 9px; }
    input[type=range] { width: 100%; padding: 0; }
    pre { white-space: pre-wrap; word-break: break-word; background: #07101a; border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--dim); font: 11px/1.45 Consolas, monospace; max-height: 55vh; overflow: auto; }
    .hidden { display: none !important; }
    .error { color: var(--bad); }
    .empty { color: var(--dim); padding: 24px 0; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .kv { grid-template-columns: 110px 1fr; } }
  </style>
</head>
<body>
<header>
  <div class="brand">Adaptive Swarm</div>
  <div class="runid" id="runId">loading...</div>
  <div class="grow"></div>
  <div class="muted mono" id="liveState">connecting...</div>
  <div class="status" id="runStatus">-</div>
</header>
<main>
  <div class="card" id="hero">
    <div class="muted">Loading run...</div>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="chat">Chat</button>
    <button data-tab="verify">Verify</button>
    <button data-tab="logbook">Logbook</button>
  </div>
  <section id="tab-overview"></section>
  <section id="tab-plan" class="hidden"></section>
  <section id="tab-chat" class="hidden"></section>
  <section id="tab-verify" class="hidden"></section>
  <section id="tab-logbook" class="hidden"></section>
</main>
<script>
  const RUN_ID = new URLSearchParams(location.search).get('run') || '__RUN_ID__';
  const state = { detail: null, events: [], diff: null, logbook: null, tab: 'overview', filter: 'all', replay: null, live: true, error: '' };
  const $ = (selector) => document.querySelector(selector);
  const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (value) => value == null ? '-' : String(value);
  const tone = (status) => ['HANDOFF_READY','DONE','PHASE_COMMITTED'].includes(String(status)) ? 'ok'
    : ['FAILED','QUARANTINED','STOPPED','BLOCKED'].includes(String(status)) ? 'bad'
      : ['AWAITING_SIGNOFF','AWAITING_USAGE','PAUSED','PROVISIONING'].includes(String(status)) ? 'warn' : '';
  async function api(path, options) {
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
    return data;
  }
  async function load() {
    if (!RUN_ID || RUN_ID === '__RUN_ID__') { state.error = 'No run id supplied.'; render(); return; }
    try {
      const [detail, events, diff, logbook] = await Promise.all([
        api('/api/unified/runs/' + encodeURIComponent(RUN_ID)),
        api('/api/unified/runs/' + encodeURIComponent(RUN_ID) + '/events?limit=200').catch(() => ({items: []})),
        api('/api/unified/runs/' + encodeURIComponent(RUN_ID) + '/diff').catch(() => ({})),
        api('/api/unified/runs/' + encodeURIComponent(RUN_ID) + '/logbook').catch(() => null),
      ]);
      state.detail = detail; state.events = events.items || []; state.diff = diff; state.logbook = logbook;
      state.error = '';
    } catch (error) {
      state.error = error.message;
    }
    render();
  }
  function render() {
    $('#runId').textContent = RUN_ID;
    const detail = state.detail || {};
    const status = detail.status || (state.error ? 'ERROR' : 'LOADING');
    const node = $('#runStatus');
    node.textContent = status; node.className = 'status ' + tone(status);
    $('#liveState').textContent = state.error ? 'disconnected' : (state.live ? 'live · polling 2s' : 'replay · paused');
    if (state.error) {
      $('#hero').innerHTML = `<div class="error">${esc(state.error)}</div>`;
      return;
    }
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));
    document.querySelectorAll('section[id^="tab-"]').forEach((s) => s.classList.add('hidden'));
    $('#tab-' + state.tab).classList.remove('hidden');
    if (state.tab === 'overview') renderOverview(detail);
    if (state.tab === 'plan') renderPlan(detail.plan || {});
    if (state.tab === 'chat') renderChat(detail);
    if (state.tab === 'verify') renderVerify(detail);
    if (state.tab === 'logbook') renderLogbook();
  }
  function renderOverview(detail) {
    const plan = detail.plan || {};
    const phases = plan.phases || [];
    const orders = phases.flatMap((p) => p.work_orders || []);
    const files = [...new Set(orders.flatMap((o) => o.target_files || []))];
    const spend = detail.spend || {};
    const timeline = (detail.timeline || []).map((step) => `<div class="step ${esc(step.state || 'pending')}"><b>${esc(step.label || step.id)}</b><div class="mono">${esc(step.state || 'pending')}</div></div>`).join('');
    $('#hero').innerHTML = `<h1>${esc(detail.goal || 'Untitled run')}</h1>
      <div class="chips">
        <span class="chip">${esc(detail.run_id)}</span>
        <span class="chip">${esc(detail.tier || '-')} / ${esc(detail.planner || '-')}</span>
        <span class="chip">${phases.length} phase(s) · ${files.length} file(s)</span>
        <span class="chip">source ${esc(detail.source || 'v2')}</span>
      </div>
      <div class="actions">
        <button class="ghost" onclick="switchTab('plan')">Open plan</button>
        <button class="ghost" onclick="switchTab('chat')">Open chat</button>
        <button class="ghost" onclick="switchTab('logbook')">Open logbook</button>
      </div>`;
    $('#tab-overview').innerHTML = `<div class="grid">
      <div><div class="card"><h2>Timeline</h2><div class="steps">${timeline || '<span class="muted">No timeline.</span>'}</div></div>
        <div class="card"><h2>Delivery</h2><div class="kv">
          <div class="k">Worktree</div><div class="mono">${esc(detail.worktree || '-')}</div>
          <div class="k">Handoff</div><div>${esc((detail.handoff || {}).ready ? 'ready' : 'not ready')}</div>
          <div class="k">Merged</div><div>${esc((detail.handoff || {}).merged ? 'yes' : 'no')}</div>
          <div class="k">Merge SHA</div><div class="mono">${esc((((detail.handoff || {}).merge) || {}).merge_sha || '-')}</div>
          <div class="k">Rolled back</div><div>${esc((detail.handoff || {}).rolled_back ? 'yes' : 'no')}</div>
        </div></div>
        <div class="card"><h2>Controls</h2><div class="actions">
          <input id="tokenInput" type="password" placeholder="run token" autocomplete="off">
          <button class="primary" onclick="action('merge')">Merge</button>
          <button class="ghost" onclick="action('rollback')">Rollback</button>
        </div>
        <div class="actions" style="margin-top:7px">
          <button class="ghost" onclick="control('pause')">Pause</button>
          <button class="ghost" onclick="control('resume')">Resume</button>
          <button class="ghost" onclick="control('stop')">Stop</button>
          <button class="ghost" onclick="approveUsage()">Approve Usage</button>
          <button class="ghost" onclick="control('accept')">Accept handoff</button>
        </div>
        <div id="actionMsg" class="muted" style="margin-top:6px"></div></div>
      </div>
      <div><div class="card"><h2>Spend</h2><div class="kv">
        <div class="k">Requests</div><div>${esc(spend.used_requests || 0)} / ${esc(spend.max_requests || '-')}</div>
        <div class="k">Tokens</div><div>${esc(spend.used_tokens || 0)} / ${esc(spend.estimated_tokens || '-')}</div>
        <div class="k">Cost</div><div>$${esc(spend.used_cost_usd || 0)}</div>
        <div class="k">Current phase</div><div class="mono">${esc(detail.current_phase || '-')}</div>
      </div></div>
      <div class="card"><h2>Evidence</h2><div class="kv">
        <div class="k">Events</div><div>${state.events.length}</div>
        <div class="k">Report</div><div class="mono">${esc((detail.handoff || {}).report || '-')}</div>
        <div class="k">Diff</div><div>${state.diff && state.diff.diff ? 'available' : 'not available'}</div>
      </div></div></div>
    </div>`;
  }
  function renderPlan(plan) {
    const phases = plan.phases || [];
    $('#tab-plan').innerHTML = `<div class="card"><h2>Plan</h2><p class="muted">${esc(plan.goal || '')}</p></div>` +
      phases.map((phase, index) => `<div class="card"><h3>Phase ${index + 1}: ${esc(phase.id || '')}</h3>
        <div class="muted mono">depends on: ${esc((phase.depends_on || []).join(', ') || 'nothing')}</div>
        ${(phase.work_orders || []).map((order) => `<div class="phase"><b class="mono">${esc(order.id || '')}</b> ${esc(order.objective || order.title || '')}
          <div class="mono muted">target: ${esc((order.target_files || []).join(', ') || '-')} · verify: ${esc(order.verify_command || '-')}</div></div>`).join('')}
      </div>`).join('') || '<div class="card empty">No plan yet.</div>';
  }
  function renderChat(detail) {
    const items = state.replay == null ? state.events : state.events.slice(0, state.replay + 1);
    const filtered = items.filter((event) => {
      const data = event.data || {};
      if (state.filter === 'all') return true;
      const sender = String(data.sender || data.role || data.agent || 'system').toLowerCase();
      if (state.filter === 'lead') return sender === 'lead';
      if (state.filter === 'system') return sender === 'system';
      return sender !== 'lead' && sender !== 'system';
    });
    const eventsHtml = filtered.map((event) => {
      const data = event.data || {};
      const sender = String(data.sender || data.role || data.agent || 'system');
      const body = data.message || data.body || data.summary || data.text || JSON.stringify(data).slice(0, 1200);
      return `<div class="msg"><span class="sender">${esc(sender)}</span><span class="time">${esc(event.timestamp)}</span>
        <div class="muted mono">${esc(event.event_type)}</div><div class="text">${esc(body)}</div></div>`;
    }).join('');
    $('#tab-chat').innerHTML = `<div class="card">
      <div class="actions">
        <select id="chatFilter" onchange="state.filter=this.value; state.replay=null; render()">
          ${['all','lead','agents','system'].map((v) => `<option value="${v}" ${state.filter === v ? 'selected' : ''}>${v}</option>`).join('')}
        </select>
        <button class="ghost" onclick="state.replay=null; state.live=true; render()">Live</button>
        <button class="ghost" onclick="switchTab('plan')">Plan</button>
        <span class="muted">${filtered.length} events</span>
      </div>
      <div style="margin-top:10px"><input type="range" min="0" max="${Math.max(0, state.events.length - 1)}" value="${state.replay == null ? Math.max(0, state.events.length - 1) : state.replay}" oninput="state.replay=Number(this.value); state.live=false; render()"></div>
      <div class="muted mono" style="margin:4px 0 10px">${state.replay == null ? 'live' : 'replay event ' + (state.replay + 1) + ' / ' + state.events.length}</div>
      ${eventsHtml || '<div class="empty">No chat events.</div>'}
    </div>`;
  }
  function renderVerify(detail) {
    const verify = detail.verify || {};
    const results = verify.results || [];
    $('#tab-verify').innerHTML = `<div class="card"><h2>Verification</h2>
      <div class="chips"><span class="chip">${verify.ok === true ? 'PASS' : verify.ok === false ? 'FAIL' : 'pending'}</span>
      <span class="chip">exit ${esc(verify.last_exit == null ? '-' : verify.last_exit)}</span></div>
      ${results.map((item) => `<div class="event"><b>${esc(item.command || verify.command || '-')}</b>
        <span class="meta">exit ${esc(item.exit_code)} · ${esc(item.event_type || '')}</span>
        ${item.output ? `<div class="body">${esc(item.output)}</div>` : ''}</div>`).join('') || '<div class="empty">No verify evidence.</div>'}
    </div><div class="card"><h2>Handoff report</h2><pre>${esc((detail.handoff || {}).report_text || 'No report yet.')}</pre></div>`;
  }
  function renderLogbook() {
    const payload = state.logbook || {};
    $('#tab-logbook').innerHTML = `<div class="card"><div class="actions"><h2 style="margin:0">Run logbook</h2>
      <button class="ghost" onclick="downloadLogbook()">Download Markdown</button></div>
      <pre>${esc(payload.markdown || 'Logbook is not available yet.')}</pre></div>`;
  }
  function switchTab(tab) { state.tab = tab; render(); }
  async function action(kind) {
    const token = ($('#tokenInput') || {}).value || '';
    if (!token) { toastAction('Run token is required.'); return; }
    if (!confirm(kind + ' is explicit. Continue?')) return;
    try {
      const data = await api('/api/unified/' + kind, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({run_id: RUN_ID, token})});
      toastAction(kind + ' → ' + (data.status || data.merge_sha || 'ok'));
      await load();
    } catch (error) { toastAction(error.message); }
  }
  async function control(actionName) {
    const token = ($('#tokenInput') || {}).value || '';
    if (!token) { toastAction('Run token is required.'); return; }
    if (actionName === 'stop' && !confirm('Stop this run?')) return;
    try {
      const data = await api('/api/unified/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({run_id: RUN_ID, token, action: actionName})});
      toastAction(actionName + ' → ' + (data.status || 'ok'));
      await load();
    } catch (error) { toastAction(error.message); }
  }
  async function approveUsage() {
    const token = ($('#tokenInput') || {}).value || '';
    if (!token) { toastAction('Run token is required.'); return; }
    try {
      const data = await api('/api/unified/usage/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({run_id: RUN_ID, token})});
      toastAction('usage → ' + (data.status || 'ok'));
      await load();
    } catch (error) { toastAction(error.message); }
  }
  function toastAction(text) { const node = $('#actionMsg'); if (node) node.textContent = text; }
  function downloadLogbook() {
    const text = (state.logbook || {}).markdown || '';
    const blob = new Blob([text], {type:'text/markdown'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = RUN_ID + '-logbook.md'; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }
  document.querySelectorAll('.tabs button').forEach((button) => button.addEventListener('click', () => switchTab(button.dataset.tab)));
  load();
  setInterval(() => { if (!document.hidden) load(); }, 2000);
</script>
</body>
</html>
