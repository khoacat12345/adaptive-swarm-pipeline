[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-swarm-pipeline"
version = "3.0.1"
description = "Unified autonomous multi-agent pipeline with zero-trust Git worktree isolation, council planning, and verification gates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "khoacat12345" },
]
keywords = [
  "ai",
  "agents",
  "autonomous",
  "coding-agent",
  "opencode",
  "worktree",
  "multi-agent",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/khoacat12345/adaptive-swarm-pipeline"
Repository = "https://github.com/khoacat12345/adaptive-swarm-pipeline"
Issues = "https://github.com/khoacat12345/adaptive-swarm-pipeline/issues"
Changelog = "https://github.com/khoacat12345/adaptive-swarm-pipeline/blob/main/docs/RELEASE_NOTES.md"

[project.scripts]
# A literal ".agents.unified.cli:main" is invalid Python (module names cannot
# start with a dot).  The hidden .agents directory is mapped to the valid
# top-level package "agents" in [tool.setuptools.package-dir] below.
swarm = "agents.unified.cli:main"

[tool.setuptools]
packages = [
  "agents",
  "agents.core",
  "agents.providers",
  "agents.unified",
  "agents.v2",
]
package-dir = { "agents" = ".agents", "agents.core" = ".agents/core", "agents.providers" = ".agents/providers", "agents.unified" = ".agents/unified", "agents.v2" = ".agents/v2" }
include-package-data = true

[tool.setuptools.package-data]
agents = ["dashboard_ui.html", "run_ui.html"]
